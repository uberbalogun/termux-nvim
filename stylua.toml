# Stylua configuration for Lua files in this Neovim config.
# Used by none-ls/none-ls formatting (see lua/formatting.lua).
# Docs: https://github.com/JohnnyMorganz/Stylua/blob/main/docs/Recipes.md

column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = true
